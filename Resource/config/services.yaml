imports:
    - { resource: settings.yaml }
    - { resource: compatibility.yaml }

services:
    _defaults:
        autowire: true
        autoconfigure: true
    Plugin\PasskeySecurity\Resource\Runtime\Config:
        arguments:
            $applicationSecret: '%kernel.secret%'
    Plugin\PasskeySecurity\Resource\Runtime\Store: ~
    Plugin\PasskeySecurity\Resource\Runtime\Policy: ~
    Plugin\PasskeySecurity\Resource\Runtime\Ceremony: ~
    Plugin\PasskeySecurity\EventSubscriber\PublicSubscriber: ~
    Plugin\PasskeySecurity\Controller\PublicController:
        arguments:
            $customerAuthenticator: '@security.authenticator.form_login.customer'
            $memberAuthenticator: '@security.authenticator.form_login.admin'
        tags: ['controller.service_arguments']
    Plugin\PasskeySecurity\EventSubscriber\StaffPasswordLoginSubscriber: ~
    Plugin\PasskeySecurity\Command\RecoveryCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
    Plugin\PasskeySecurity\Resource\Runtime\LegacyShopMigration:
        arguments:
            $projectDir: '%kernel.project_dir%'
    Plugin\PasskeySecurity\Command\LegacyMigrationCommand: ~
